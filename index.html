<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Link233</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <link href="css/jcarousel.css" rel="stylesheet">
    <link href="css/flexslider.css" rel="stylesheet">
    <link href="js/owl-carousel/owl.carousel.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body,#wrapper{background:#000!important;min-height:100vh;color:#fff;}
        .navbar-default{margin-bottom:0!important;background:transparent!important;border:none!important;}

        .btn-section{position:relative;width:100%;padding:20px 20px!important;overflow:visible;background:transparent!important;z-index:9999!important;pointer-events:auto!important;}
        .btn-container{display:flex;justify-content:center;gap:20px;padding:10px 20px!important;margin:0 auto;max-width:500px;position:relative;z-index:9999!important;pointer-events:auto!important;}
        .btn-container .btn{
            min-width:120px;background:linear-gradient(135deg,#1f65b5,#9c2189)!important;color:#fff!important;
            border:none!important;border-radius:8px!important;transition:all .3s ease!important;z-index:9999!important;pointer-events:auto!important;
        }
        .btn-container .btn:hover{
            background:linear-gradient(135deg,#9c2189,#1f65b5)!important;transform:translateY(-2px)!important;
            box-shadow:0 4px 15px rgba(156,33,137,.4)!important;
        }

        .flex-caption h3,.flex-caption p{
            color:#fff!important;text-shadow:0 2px 4px rgba(0,0,0,.8);
        }

        #global-particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:auto!important;}
        #main-slider{position:relative;z-index:2;background:transparent!important;padding:5px 0!important;}
        #main-slider .slides img{
            border-radius:12px!important;margin:0 auto!important;max-width:98%!important;box-shadow:0 0 20px rgba(255,255,255,.1);
        }

        .container,.row,.col-lg-12,.col-sm-12{background:transparent!important;border:none!important;}
    </style>
</head>

    <script src="js/jquery.js"></script>

    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.fancybox.pack.js"></script>
    <script src="js/jquery.fancybox-media.js"></script>
    <script src="js/flexslider/jquery.flexslider.js"></script>
    <script src="js/flexslider/setting.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>

    <script>
        if (typeof particlesJS === "undefined") {
            document.write('<script src="js/particles.min.js"><\/script>');
        }
    </script>

    <script>
        const particleColors=["#ff4444","#ffbb33","#00C851","#33b5e5","#aa66cc","#ff99cc","#6699ff","#ffff66","#ff6600","#00ff99","#9966ff","#ff33cc","#00ffff","#ffd700","#ff69b4","#87ceeb"];
        function startParticles(){
            particlesJS("global-particles",{
                particles:{number:{value:120,density:{enable:true,value_area:1000}},color:{value:particleColors},shape:{type:"circle"},opacity:{value:.6,random:true},size:{value:3,random:true},line_linked:{enable:true,distance:150,color:"#ffffff",opacity:.3,width:1},move:{enable:true,speed:1.5,direction:"none",random:true,out_mode:"out",bounce:false}},
                interactivity:{detect_on:"canvas",events:{onhover:{enable:true,mode:"grab"},onclick:{enable:true,mode:"push"},resize:true},modes:{grab:{distance:120,line_linked:{opacity:.6}},push:{particles_nb:3}}},
                retina_detect:true
            });
        }
        if (typeof particlesJS !== "undefined") {
            startParticles();
        } else {
            document.addEventListener("readystatechange",function(){
                if(typeof particlesJS!=="undefined") startParticles();
            });
        }
    </script>
