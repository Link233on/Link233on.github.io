name: "refresh"

on: 
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}  # 确保与 GitHub Secrets 中的名称一致

      - name: Install Dependencies
        if: success()
        run: |
          sudo apt update -qq
          sudo apt install dpkg-dev bzip2 xz-utils zstd -y

      - name: Refresh Packages
        if: success()
        run: |
          # 清理旧版Packages
          rm -rf ./Packages*

          # 扫描生成并压缩Packages
          dpkg-scanpackages -m ./debs /dev/null > ./Packages
          bzip2 -v -k -9 Packages
          xz -v -k -9 --extreme Packages
          zstd --ultra -22 -k Packages -o Packages.zst

          # 配置 Git 提交身份
          git config --global user.email 'action@github.com'
          git config --global user.name 'GitHub Action'

          # 暂存索引文件检测变更
          git add Packages Packages.zst Packages.bz2 Packages.xz
          if git diff --staged --quiet; then
            exit 0
          fi

          # 生成 Release
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="inn's Repo" \
            -o APT::FTPArchive::Release::Label="inn's Repo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Version="1.0" \
            -o APT::FTPArchive::Release::Codename="Link233on" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm iphoneos-arm64 iphoneos-arm64e" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Link233on opens the repository for sharing" \
            release . > Release

          # 提交推送变更
          git add .
          git commit -m 'Refresh Packages'
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push origin main

      - name: Download remove_all_actions
        if: success()
        run: |
          sudo curl -L -o '/usr/bin/remove_all_actions' 'https://raw.githubusercontent.com/invalidunit/action/main/remove_all_actions'
          sudo chmod -R 0755 '/usr/bin/remove_all_actions'

      - name: Remove All Old Actions
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}  # 使用 PAT 替代默认的 GITHUB_TOKEN
          GH_REPO: ${{ github.repository }}
        run: |
          remove_all_actions
